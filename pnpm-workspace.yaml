packages:
  - apps/*
  - extensions/*
  - packages/*
allowBuilds:
  '@vscode/vsce-sign': false
  electron: true
  esbuild: true
overrides:
  # VSCE's Azure identity dependency still requests MSAL 6; auth-code flow is affected by GHSA-xcx6-jx8p-x3h5.
  # Packaging uses no Azure authentication. Pin the patched release until upstream updates its range.
  '@azure/identity>@azure/msal-node': 7.1.0
