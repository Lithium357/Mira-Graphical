name: CI
on: [push, pull_request]
jobs:
  verify:
    name: Windows workbench and VS Code
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:soak --cycles=10 --lanes=32
      - run: pnpm run licenses
      - run: pnpm audit --audit-level=high
      - run: pnpm build
      - run: pnpm smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: |
            test-results/desktop-smoke.png
            test-results/workspace-*.png
            test-results/language-*.png
            test-results/recovery-smoke.png
            test-results/desktop-smoke.json
            test-results/vscode-smoke.json
            test-results/vscode-smoke-*.log
            test-results/*-failure.png
            dist/packages/*.vsix
            dist/packages/manifest.json
            dist/packages/SHA256SUMS
            test-results/project-soak.json
            test-results/accessibility-smoke.json
            test-results/onboarding-smoke.json
            test-results/window-activation-smoke.json
            test-results/alu-smoke.json
            test-results/alu-layout*.png
            test-results/signed-alu.png
            test-results/clocked-multiplier.png
            test-results/clocked-smoke.json
            test-results/launch-features-smoke.json
            test-results/enum-fsm.png
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:windows
      - run: pnpm test:installer
      - shell: pwsh
        run: |
          $installer = Get-ChildItem dist/windows/Mira-Graphical-Setup-*-x64.exe
          if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'NotSigned') { throw 'Installer must be unsigned' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          compression-level: 0
          path: |
            dist/windows/Mira-Graphical-Setup-*-x64.exe
            dist/windows/Mira-Graphical-Source.zip
            dist/windows/manifest.json
            dist/windows/SHA256SUMS
            test-results/installer-smoke.json
  linux-desktop:
    name: Linux workbench and VS Code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 openbox libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      # The ephemeral Ubuntu runner restricts downloaded development binaries.
      # Allow Chromium's user-namespace sandbox; never pass --no-sandbox to Mira.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm format:check && pnpm test
      - run: pnpm run licenses && pnpm build
      - run: dbus-run-session -- xvfb-run -a sh -c 'openbox >/tmp/mira-openbox.log 2>&1 & pnpm smoke'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-desktop-results
          path: |
            test-results/*smoke*.json
            test-results/*.png
            test-results/vscode-smoke-*.log
  debian-package:
    name: Debian amd64 package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:linux
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install, upgrade, run and remove on Debian 12 and 13
        run: |
          for version in 12 13; do
            mkdir -p "test-results/debian-$version"
            docker run --rm --cap-add=SYS_ADMIN --security-opt seccomp=unconfined --shm-size=1g \
              -e MIRA_DISPOSABLE_DEBIAN_TEST=1 \
              -v "$PWD/dist/linux:/artifacts:ro" \
              -v "$PWD/scripts/debian-smoke.sh:/debian-smoke.sh:ro" \
              -v "$PWD/test-results/debian-$version:/results" \
              "debian:$version" bash /debian-smoke.sh
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-package
          compression-level: 0
          path: |
            dist/linux/*.deb
            dist/linux/Mira-Graphical-Source.zip
            dist/linux/manifest.json
            dist/linux/SHA256SUMS
            dist/packages/*.vsix
            dist/packages/manifest.json
            test-results/debian-*/
  hdl-reference:
    name: HDL compiler reference checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ghdl iverilog
      - run: pnpm test
      - run: pnpm test:languages
      - run: pnpm test:alu
      - run: pnpm test:clocked
      - run: pnpm test:projects
      - run: pnpm test:enums
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdl-reference-results
          path: |
            test-results/hdl-reference/
            test-results/alu-reference/
            test-results/clocked-reference/
            test-results/projects-reference/
            test-results/enum-reference/
  acceptance:
    name: Real-time release acceptance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:acceptance --seconds=120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-acceptance
          path: test-results/release-acceptance.json
